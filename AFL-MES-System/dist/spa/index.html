<!DOCTYPE html><html><head><title>MES App</title><meta charset=utf-8><meta name=description content="A Quasar Project"><meta name=format-detection content="telephone=no"><meta name=msapplication-tap-highlight content=no><meta name=viewport content="user-scalable=no,initial-scale=1,maximum-scale=1,minimum-scale=1,width=device-width"><link rel=icon type=image/png sizes=128x128 href="/icons/favicon-128x128.png"><link rel=icon type=image/png sizes=96x96 href="/icons/favicon-96x96.png"><link rel=icon type=image/png sizes=32x32 href="/icons/favicon-32x32.png"><link rel=icon type=image/png sizes=16x16 href="/icons/favicon-16x16.png"><link rel=icon type=image/ico href="/favicon.ico">  <script type="module" crossorigin src="/assets/index.e737e5e9.js"></script>
  <link rel="stylesheet" href="/assets/index.5beb24eb.css">
</head><body><div id=q-app></div><script>window.addEventListener("DOMContentLoaded", () => {
        const host = window.location.hostname;

        // Elimina íconos previos
        document
          .querySelectorAll("link[rel~='icon']")
          .forEach((el) => el.parentNode.removeChild(el));

        // Crea nuevo ícono
        const favicon = document.createElement("link");
        favicon.rel = "icon";
        favicon.type = "image/png";

        if (host === "localhost") {
          favicon.href="/img/AFL2.png";
        } else if (host === "spbmes-devign") {
          favicon.href="/icons/favicon.ico";
        } else {
          favicon.href="/icons/favicon.ico";
        }

        console.log("Host:", host, " - Favicon:", favicon.href); // 🔍 Para depurar

        document.head.appendChild(favicon);
      });</script></body></html>
